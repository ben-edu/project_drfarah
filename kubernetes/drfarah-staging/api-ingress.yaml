# Traefik Ingress for the staging API.
# TLS is terminated upstream on HAProxy (BM2) — no tls: block here.
# Traffic arrives already decrypted via the WireGuard tunnel.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drfarah-staging-api
  namespace: drfarah-staging
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: api-staging.drfarahvipurgentcare.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: drfarah-staging-api
                port:
                  number: 80
    # Temporary compatibility host during the cutover window.
    - host: api.staging.drfarah.proxbenovh.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: drfarah-staging-api
                port:
                  number: 80

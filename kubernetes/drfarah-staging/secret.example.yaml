# EXEMPLE de Secrets — NE JAMAIS committer les vraies valeurs.
# Copier en secret.yaml (git-ignoré) ou créer via kubectl.
#
# Architecture email transactionnelle :
#   - L'API HTTPS Brevo est le transport principal.
#   - BREVO_API_KEY est une clé API Brevo, jamais une clé SMTP.
#   - SMTP_USER et SMTP_PASSWORD restent uniquement pour un rollback explicite.
#   - L'identité d'envoi est notifications@drfarahvipurgentcare.com.
#   - SMTP_PASSWORD doit contenir une clé SMTP Brevo, jamais le mot de passe
#     du compte Brevo.
#   - Le destinataire de notification (SMTP_TO) est configurable séparément
#     et ne doit pas être confondu avec l'expéditeur.
#
# Création recommandée sans fichier en clair :
#   kubectl -n drfarah-staging create secret generic drfarah-staging-db-secret \
#     --from-literal=POSTGRES_USER=drfarah \
#     --from-literal=POSTGRES_PASSWORD='<mot-de-passe-fort>' \
#     --from-literal=POSTGRES_DB=drfarah
#
#   kubectl -n drfarah-staging create secret generic drfarah-staging-api-secret \
#     --from-literal=DATABASE_URL='postgresql+psycopg://drfarah:<password>@drfarah-staging-postgres:5432/drfarah' \
#     --from-literal=POSTGRES_USER=drfarah \
#     --from-literal=POSTGRES_PASSWORD='<mot-de-passe-fort>' \
#     --from-literal=BREVO_API_KEY='<brevo-api-key>' \
#     --from-literal=SMTP_USER='<brevo-smtp-login>' \
#     --from-literal=SMTP_PASSWORD='<brevo-smtp-key>' \
#     --from-literal=CLEANUP_TOKEN='<cleanup-token>'
#
# Le pull secret Harbor (harbor-regcred) doit être copié depuis le
# namespace toilettage une fois le namespace drfarah-staging créé.
---
apiVersion: v1
kind: Secret
metadata:
  name: drfarah-staging-db-secret
  namespace: drfarah-staging
  labels:
    app: drfarah-staging-postgres
type: Opaque
stringData:
  POSTGRES_USER: "drfarah"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "drfarah"
---
apiVersion: v1
kind: Secret
metadata:
  name: drfarah-staging-api-secret
  namespace: drfarah-staging
  labels:
    app: drfarah-staging-api
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://drfarah:CHANGE_ME@drfarah-staging-postgres:5432/drfarah"
  POSTGRES_USER: "drfarah"
  POSTGRES_PASSWORD: "CHANGE_ME"
  BREVO_API_KEY: "CHANGE_ME"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
  CLEANUP_TOKEN: "CHANGE_ME"

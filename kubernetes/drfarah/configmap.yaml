# Non-secret configuration for the Dr. Farah PRODUCTION API.
# Soria SMTP is an explicitly approved temporary production relay. Credentials
# remain in drfarah-api-secret and must never be committed here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: drfarah-api-config
  namespace: drfarah
  labels:
    app: drfarah-api
data:
  ENVIRONMENT: "prod"
  APP_NAME: "drfarah-api"
  LOG_LEVEL: "INFO"
  POSTGRES_HOST: "drfarah-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "drfarah"
  CORS_ORIGINS: "https://drfarahvipurgentcare.com,https://www.drfarahvipurgentcare.com,https://admin.drfarahvipurgentcare.com"
  TRUST_PROXY: "true"
  KEYCLOAK_ISSUER: "https://keycloak.soria-academie.fr/realms/drfarah"
  KEYCLOAK_JWKS_URL: "https://keycloak.soria-academie.fr/realms/drfarah/protocol/openid-connect/certs"
  KEYCLOAK_AUDIENCE: "drfarah-admin"
  KEYCLOAK_VERIFY_AUD: "false"
  SMTP_HOST: "mail.soria-academie.fr"
  SMTP_PORT: "587"
  SMTP_FROM: "contact@soria-academie.fr"
  SMTP_TO: "appointment@soria-academie.fr"
  SMTP_USE_TLS: "true"
  SMTP_TEST_MODE: "false"

# Non-secret configuration for the Dr. Farah PRODUCTION API.
# Brevo's HTTPS API is the primary transactional email transport. The API key
# and SMTP rollback credentials remain in drfarah-api-secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: drfarah-api-config
  namespace: drfarah
  labels:
    app: drfarah-api
data:
  ENVIRONMENT: "prod"
  APP_NAME: "drfarah-api"
  LOG_LEVEL: "INFO"
  POSTGRES_HOST: "drfarah-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "drfarah"
  CORS_ORIGINS: "https://drfarahvipurgentcare.com,https://www.drfarahvipurgentcare.com,https://admin.drfarahvipurgentcare.com"
  TRUST_PROXY: "true"
  KEYCLOAK_ISSUER: "https://keycloak.soria-academie.fr/realms/drfarah"
  KEYCLOAK_JWKS_URL: "https://keycloak.soria-academie.fr/realms/drfarah/protocol/openid-connect/certs"
  KEYCLOAK_AUDIENCE: "drfarah-admin"
  KEYCLOAK_VERIFY_AUD: "false"
  ADMIN_PORTAL_URL: "https://admin.drfarahvipurgentcare.com"
  EMAIL_TRANSPORT: "brevo_api"
  EMAIL_FROM_NAME: "Dr. Farah VIP Urgent Care"
  EMAIL_TIMEOUT_SECONDS: "20"
  EMAIL_MAX_ATTEMPTS: "3"
  BREVO_API_URL: "https://api.brevo.com/v3/smtp/email"
  SMTP_HOST: "smtp-relay.brevo.com"
  SMTP_PORT: "587"
  SMTP_FROM: "notifications@drfarahvipurgentcare.com"
  SMTP_TO: "eskandari_farah@yahoo.com,info@drfarahvipurgentcare.com"
  SMTP_USE_TLS: "true"
  SMTP_TEST_MODE: "false"

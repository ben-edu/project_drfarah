# EXAMPLE ONLY — never commit real production values.
#
# Create production secrets out of band. Production credentials must be
# independent from staging.
# BREVO_API_KEY is the primary HTTPS API credential. SMTP_USER and
# SMTP_PASSWORD remain only for an explicit rollback transport.
#
# Example:
# kubectl -n drfarah create secret generic drfarah-db-secret \
#   --from-literal=POSTGRES_USER=drfarah \
#   --from-literal=POSTGRES_PASSWORD='<strong-production-password>' \
#   --from-literal=POSTGRES_DB=drfarah
#
# kubectl -n drfarah create secret generic drfarah-api-secret \
#   --from-literal=DATABASE_URL='postgresql+psycopg://drfarah:<password>@drfarah-postgres:5432/drfarah' \
#   --from-literal=POSTGRES_USER=drfarah \
#   --from-literal=POSTGRES_PASSWORD='<strong-production-password>' \
#   --from-literal=BREVO_API_KEY='<independent-production-brevo-api-key>' \
#   --from-literal=SMTP_USER='<brevo-smtp-login>' \
#   --from-literal=SMTP_PASSWORD='<brevo-smtp-key>'
---
apiVersion: v1
kind: Secret
metadata:
  name: drfarah-db-secret
  namespace: drfarah
type: Opaque
stringData:
  POSTGRES_USER: "drfarah"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "drfarah"
---
apiVersion: v1
kind: Secret
metadata:
  name: drfarah-api-secret
  namespace: drfarah
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://drfarah:CHANGE_ME@drfarah-postgres:5432/drfarah"
  POSTGRES_USER: "drfarah"
  POSTGRES_PASSWORD: "CHANGE_ME"
  BREVO_API_KEY: "CHANGE_ME"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
